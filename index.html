<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Огонёк</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* =====================================================================
   ЦВЕТА — берутся из темы Telegram. Запасные значения — для браузера.
   ===================================================================== */
:root{
  --bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #111111);
  --hint: var(--tg-theme-hint-color, #8e8e93);
  --accent: var(--tg-theme-button-color, #ff7a00);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --danger: var(--tg-theme-destructive-text-color, #e5484d);
  --line: rgba(128,128,128,.16);
  --soft: rgba(128,128,128,.09);
  --fire: #ff8a00;
  --radius: 18px;
  --top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  --bottom: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not(.tg){ --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --hint:#8e8e93; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{min-height:100vh;padding:calc(10px + var(--top)) 16px calc(96px + var(--bottom))}
body.no-tabs{padding-bottom:calc(24px + var(--bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:var(--text);-webkit-user-select:text;user-select:text}
.screen{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.num{font-variant-numeric:tabular-nums}

/* ===== Шапка ===== */
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 14px;gap:12px}
.hello{font-size:13px;color:var(--hint);margin-bottom:2px}
.title{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.ring{position:relative;width:56px;height:56px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}

/* ===== Неделя ===== */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border-radius:var(--radius);padding:8px 6px;margin-bottom:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 8px;border-radius:13px;transition:background .2s}
.day small{font-size:11px;color:var(--hint);font-weight:600}
.day b{font-size:16px;font-weight:700}
.day.sel{background:var(--accent);color:var(--accent-text)}
.day.sel small{color:var(--accent-text);opacity:.85}
.day.future{opacity:.3;pointer-events:none}
.bar{width:22px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.day.sel .bar{background:rgba(255,255,255,.3)}
.day.sel .bar i{background:var(--accent-text)}

/* ===== Секции и карточки ===== */
.section{font-size:13px;font-weight:600;color:var(--hint);margin:18px 6px 8px;text-transform:uppercase;letter-spacing:.3px}
.section:first-child{margin-top:0}
.list{display:flex;flex-direction:column;gap:10px}
.habit{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);
  padding:12px 12px 12px 12px;transition:transform .15s;overflow:hidden}
.habit:active{transform:scale(.985)}
.habit.off{opacity:.55}
.habit .fill{position:absolute;left:0;top:0;bottom:0;opacity:.11;transition:width .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;flex:none;position:relative}
.hinfo{flex:1;min-width:0;position:relative}
.hname{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmeta{font-size:13px;color:var(--hint);margin-top:3px;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.fire{color:var(--fire);font-weight:700}
.habit.done .hname{opacity:.6}
.act{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;
  transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.act:active{transform:scale(.9)}
.act svg.pr{position:absolute;inset:0;transform:rotate(-90deg)}
.act .glyph{position:relative;width:20px;height:20px;display:grid;place-items:center}
.act .glyph svg{width:20px;height:20px}
.check-path{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease .05s}
.act.on .check-path{stroke-dashoffset:0}
.act.running{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.live{color:var(--fire);font-weight:700}

.empty{text-align:center;padding:52px 20px;color:var(--hint);line-height:1.5}
.empty div{font-size:50px;margin-bottom:10px}

/* ===== Нижнее меню ===== */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--bottom));height:64px;border-radius:22px;background:var(--card);
  display:grid;grid-template-columns:1fr 76px 1fr;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--hint)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.plus{width:56px;height:56px;margin:0 auto;border-radius:18px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .15s}
.plus:active{transform:scale(.92)}
.plus svg{width:26px;height:26px}

/* ===== Кнопки и поля ===== */
.btn{width:100%;height:52px;border-radius:15px;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:16px}
.btn.sec{background:var(--soft);color:var(--text)}
.btn.ghost{background:transparent;color:var(--danger);font-weight:600}
.btn:disabled{opacity:.4}
.field{width:100%;height:50px;border-radius:14px;border:0;background:var(--soft);padding:0 14px;font-size:16px;outline:none}
.label{font-size:13px;color:var(--hint);margin:18px 2px 8px;font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:13px;padding:3px;gap:3px}
.seg button{height:38px;border-radius:10px;font-size:14px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:20px;background:var(--soft);font-size:14px;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-text)}
.row{display:flex;gap:10px;align-items:center}
.row .field{flex:1}
.stepper{display:flex;align-items:center;background:var(--soft);border-radius:14px;height:50px;flex:1}
.stepper button{width:44px;height:50px;font-size:22px;font-weight:500;color:var(--accent)}
.stepper input{flex:1;width:40px;text-align:center;border:0;background:none;font-size:18px;font-weight:700;outline:none}
.stepper small{color:var(--hint);font-size:13px;padding-right:12px}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wdays button{height:40px;border-radius:12px;background:var(--soft);font-size:13px;font-weight:700;color:var(--hint)}
.wdays button.on{background:var(--accent);color:var(--accent-text)}

/* ===== Нижний лист ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:10;animation:fadebg .2s}
@keyframes fadebg{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;z-index:11;
  padding:10px 16px calc(18px + var(--bottom));max-height:calc(100vh - 40px - var(--top));overflow:auto;
  animation:up .3s cubic-bezier(.2,.9,.3,1);-webkit-overflow-scrolling:touch}
.sheet.closing{animation:down .22s ease forwards}
.sheet-bg.closing{animation:fadeout .22s forwards}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fadeout{to{opacity:0}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:21px;letter-spacing:-.3px}
.preview{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:10px 12px;margin-bottom:14px}
.preview .ico{width:44px;height:44px;font-size:23px}
.preview b{font-size:16px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.emojis button{aspect-ratio:1;border-radius:11px;font-size:22px}
.emojis button.on{background:var(--soft);outline:2.5px solid var(--accent);outline-offset:-2.5px}
.ecat{font-size:12px;color:var(--hint);margin:10px 2px 6px;font-weight:600}
.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.colors button{aspect-ratio:1;border-radius:50%;transition:transform .15s}
.colors button.on{transform:scale(.82);box-shadow:0 0 0 3px var(--card),0 0 0 6px currentColor}

/* Лист прогресса */
.big{font-size:44px;font-weight:800;text-align:center;letter-spacing:-1px;margin:6px 0 2px}
.bigsub{text-align:center;color:var(--hint);font-size:14px;margin-bottom:14px}
.pbar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin:0 0 16px}
.pbar i{display:block;height:100%;border-radius:5px;transition:width .35s}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{height:46px;border-radius:13px;background:var(--soft);font-weight:700;font-size:15px}

/* ===== Экран привычки ===== */
.back{font-size:16px;color:var(--accent);margin:2px 0 12px;display:inline-flex;gap:4px;align-items:center;font-weight:500}
.dhead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.dhead .ico{width:64px;height:64px;font-size:34px;border-radius:20px}
.dhead h2{margin:0;font-size:24px;line-height:1.15;word-break:break-word;letter-spacing:-.4px}
.dhead p{margin:4px 0 0;color:var(--hint);font-size:14px}
.edit{margin-left:auto;align-self:flex-start;width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;flex:none}
.edit svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px 14px 13px}
.stat b{display:block;font-size:25px;font-weight:800;letter-spacing:-.5px}
.stat small{color:var(--hint);font-size:13px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h4{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.card h4 small{color:var(--hint);font-weight:500;font-size:13px}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.calnav button{width:36px;height:36px;border-radius:11px;background:var(--soft);font-size:18px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.calgrid .wd{font-size:11px;color:var(--hint);padding-bottom:4px;font-weight:600}
.cd{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-size:14px;font-weight:600;background:var(--soft);position:relative;overflow:hidden}
.cd i{position:absolute;inset:0}
.cd span{position:relative}
.cd.on span{color:#fff}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.fut{opacity:.3}
.cd.rest{background:none;color:var(--hint)}
.cd.pad{background:none}
.tip{font-size:12px;color:var(--hint);text-align:center;margin-top:10px}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px;position:relative;padding-top:6px}
.chart .col{flex:1;border-radius:5px 5px 2px 2px;min-height:3px;transition:height .4s}
.chart .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--hint);opacity:.55}
.chart-x{display:flex;justify-content:space-between;font-size:11px;color:var(--hint);margin-top:6px}
.adjust{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.adjust button{height:44px;border-radius:13px;background:var(--soft);font-weight:700;font-size:14px}

/* ===== Статистика ===== */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--soft)}
.heat-legend{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--hint);margin-top:8px}
.heat-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.rank{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}
.rank .ico{width:38px;height:38px;font-size:20px;border-radius:12px}
.rank > div:not(.ico){flex:1;min-width:0}
.rank b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank small{color:var(--hint);font-size:12px}
.rank .pct{font-weight:800;font-size:15px}
.invite{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#ff7a00,#ff3d00);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px}
.invite div{flex:1}
.invite b{display:block;font-size:16px}
.invite small{opacity:.9;font-size:13px}
.invite span{font-size:34px}

/* ===== Онбординг ===== */
.onb{min-height:calc(100vh - 150px - var(--top));display:flex;flex-direction:column;justify-content:center;text-align:center;padding:0 6px}
.onb .bigemoji{font-size:80px;margin-bottom:14px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.onb h1{font-size:29px;margin:0 0 10px;letter-spacing:-.6px}
.onb p{color:var(--hint);font-size:16px;line-height:1.45;margin:0 0 22px}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:all .2s}
.dots i.on{width:22px;background:var(--accent)}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + var(--bottom));height:54px;border-radius:16px;
  background:var(--accent);color:var(--accent-text);font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5}

/* ===== Праздник и уведомления ===== */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-size:24px;font-style:normal;animation:fall 1.8s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(560deg);opacity:.15}}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--bottom));transform:translateX(-50%);max-width:calc(100% - 32px);
  background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:31;
  animation:fade .2s;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   НАСТРОЙКИ
   ===================================================================== */
const APP_NAME = "Огонёк";
const BOT_LINK = "https://t.me/ogonyok_app_bot?startapp";   // ссылка для приглашений

const EMOJI_CATS = [
  ["Здоровье", ["💧","🍎","🥦","🥗","💊","😴","🛌","🦷","🧴","🍵","🥛","🫐","🥚","🍌","🧊","🌙"]],
  ["Спорт",    ["💪","🏃","🚶","🏋️","🚴","🏊","🧘","⚽","🏀","🥊","🤸","⛹️","🧗","🎾","🏓","👟"]],
  ["Ум",       ["📚","🧠","✍️","📝","🎓","💻","🗣️","🎧","🎹","🎸","🎨","📷","🧩","♟️","🔬","📖"]],
  ["Жизнь",    ["🎯","☀️","🧹","🧺","🪴","🐶","💰","📅","🙏","❤️","😊","📞","🧺","🛁","🌿","✨"]],
  ["Отказ от", ["🚭","🍺","🍔","🍬","🥤","📵","🎮","☕","🍟","🍕","📱","⏰","🛑","🙅","🧂","🚫"]],
];
const COLORS = ["#ff7a00","#ff3b30","#ff2d55","#af52de","#5856d6","#007aff","#32ade6","#00c7be","#34c759","#a2c516","#ffcc00","#8e8e93"];
const UNITS = ["раз","шагов","стаканов","страниц","км","отжиманий","приседаний","мл"];
const TIME_CHIPS = [10,15,20,30,45,60,90,120];

// Готовые привычки: type: check | count | time
const TEMPLATES = [
  {name:"Пить воду",       emoji:"💧", color:"#32ade6", type:"count", target:8,     unit:"стаканов"},
  {name:"10 000 шагов",    emoji:"👟", color:"#34c759", type:"count", target:10000, unit:"шагов"},
  {name:"Тренировка",      emoji:"💪", color:"#ff7a00", type:"check"},
  {name:"Чтение",          emoji:"📚", color:"#af52de", type:"time",  target:20},
  {name:"Без фастфуда",    emoji:"🍔", color:"#ff3b30", type:"check"},
  {name:"Сон до 00:00",    emoji:"🌙", color:"#5856d6", type:"check"},
  {name:"Медитация",       emoji:"🧘", color:"#00c7be", type:"time",  target:10},
  {name:"Английский",      emoji:"🗣️", color:"#007aff", type:"time",  target:30},
];
const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

/* =====================================================================
   TELEGRAM
   ===================================================================== */
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const can = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
if (tg) {
  tg.ready(); tg.expand();
  if (inTG) document.documentElement.classList.add("tg");
  try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch(e) {}
  try { if (can("7.10")) tg.setBottomBarColor("secondary_bg_color"); } catch(e) {}
  try { if (can("7.7")) tg.disableVerticalSwipes(); } catch(e) {}
}
const userName = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || "";

function haptic(type) {
  try {
    if (!tg || !tg.HapticFeedback || !can("6.1")) return;
    if (type === "success" || type === "warning" || type === "error") tg.HapticFeedback.notificationOccurred(type);
    else if (type === "select") tg.HapticFeedback.selectionChanged();
    else tg.HapticFeedback.impactOccurred(type || "light");
  } catch(e) {}
}
function confirmBox(text) {
  return new Promise(res => {
    if (inTG && can("6.2")) tg.showConfirm(text, ok => res(!!ok));
    else res(window.confirm(text));
  });
}

/* =====================================================================
   ХРАНИЛИЩЕ
   В Telegram — CloudStorage (данные в аккаунте пользователя, видны
   на всех его устройствах). В браузере — localStorage.
   Значение в CloudStorage ≤ 4096 символов → режем на куски.
   ===================================================================== */
const useCloud = inTG && tg.CloudStorage && can("6.9");
const KEY = "st", CHUNK = 4000;

const cloudGet = keys => new Promise((res, rej) =>
  tg.CloudStorage.getItems(keys, (err, vals) => err ? rej(err) : res(vals || {})));
const cloudSet = (k, v) => new Promise((res, rej) =>
  tg.CloudStorage.setItem(k, v, err => err ? rej(err) : res()));
const cloudRemove = keys => new Promise(res =>
  keys.length ? tg.CloudStorage.removeItems(keys, () => res()) : res());

async function loadRaw() {
  if (!useCloud) { try { return localStorage.getItem(KEY) || ""; } catch(e) { return ""; } }
  const meta = await cloudGet([KEY + "_n"]);
  const n = parseInt(meta[KEY + "_n"] || "0", 10);
  if (!n) return "";
  const keys = Array.from({length:n}, (_, i) => KEY + "_" + i);
  const vals = await cloudGet(keys);
  return keys.map(k => vals[k] || "").join("");
}
let savedChunks = 0;
async function saveRaw(str) {
  if (!useCloud) { try { localStorage.setItem(KEY, str); } catch(e) {} return; }
  const parts = [];
  for (let i = 0; i < str.length; i += CHUNK) parts.push(str.slice(i, i + CHUNK));
  for (let i = 0; i < parts.length; i++) await cloudSet(KEY + "_" + i, parts[i]);
  await cloudSet(KEY + "_n", String(parts.length));
  const extra = [];
  for (let i = parts.length; i < savedChunks; i++) extra.push(KEY + "_" + i);
  await cloudRemove(extra);
  savedChunks = parts.length;
}

// Очередь сохранений: не даём двум записям перемешаться
let loaded = false, saving = false, pending = false, saveTimer = null;
function save(now) {
  if (!loaded) return;                       // данные не загрузились — не перезаписываем облако пустыми
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, now ? 0 : 400);
}
async function flush() {
  if (saving) { pending = true; return; }
  saving = true;
  try { await saveRaw(JSON.stringify(state)); }
  catch(e) { toast("Не удалось сохранить — проверь интернет"); }
  saving = false;
  if (pending) { pending = false; flush(); }
}
document.addEventListener("visibilitychange", () => { if (document.hidden && loaded) { clearTimeout(saveTimer); flush(); } });

/* =====================================================================
   ДАННЫЕ
   День хранится числом — номер дня с 1970 года.
   habit = { id, name, emoji, color, type, target, unit, days:[0..6],
             created, done:[дни] (для отметок), log:{день: значение} }
   Для type="time" значение в log — секунды, target — минуты.
   ===================================================================== */
let state = { v:2, onboarded:false, habits:[], timer:null };

const dayNum = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
const fromDay = n => { const d = new Date(n * 86400000); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
const today = () => dayNum(new Date());
const wdOf = n => (fromDay(n).getDay() + 6) % 7;           // 0 = понедельник
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmtN = n => Math.round(n).toLocaleString("ru-RU");

function migrate(data) {
  const s = Object.assign({ v:2, onboarded:true, habits:[], timer:null }, data);
  s.habits = (s.habits || []).map(h => Object.assign({
    type:"check", target:1, unit:"", days:[0,1,2,3,4,5,6], log:{}, done:[]
  }, h));
  s.habits.forEach(h => { if (!Array.isArray(h.done)) h.done = []; if (!h.log || typeof h.log !== "object") h.log = {}; });
  s.v = 2;
  return s;
}

const isScheduled = (h, day) => h.days.length === 7 || h.days.includes(wdOf(day));
function value(h, day) {               // текущее значение за день
  if (h.type === "check") return h.done.includes(day) ? 1 : 0;
  let v = h.log[day] || 0;
  if (h.type === "time" && state.timer && state.timer.id === h.id && state.timer.day === day)
    v += (Date.now() - state.timer.start) / 1000;
  return v;
}
const goal = h => h.type === "time" ? h.target * 60 : h.type === "count" ? h.target : 1;
const frac = (h, day) => Math.min(1, value(h, day) / goal(h));
const isDone = (h, day) => value(h, day) >= goal(h);

function setValue(h, day, v) {
  v = Math.max(0, v);
  if (h.type === "check") {
    const i = h.done.indexOf(day);
    if (v >= 1 && i < 0) { h.done.push(day); h.done.sort((a, b) => a - b); }
    if (v < 1 && i >= 0) h.done.splice(i, 1);
  } else {
    if (v > 0) h.log[day] = Math.round(v); else delete h.log[day];
  }
  save();
}
function firstDay(h) {
  let f = h.created;
  if (h.done.length) f = Math.min(f, h.done[0]);
  for (const k in h.log) f = Math.min(f, +k);
  return f;
}
/* Серия: подряд выполненные ЗАПЛАНИРОВАННЫЕ дни. Дни отдыха серию не рвут.
   Сегодняшний невыполненный день серию тоже не рвёт — день ещё не закончился. */
function streak(h) {
  const t = today(), start = firstDay(h);
  let n = 0;
  for (let d = t; d >= start; d--) {
    if (!isScheduled(h, d)) continue;
    if (isDone(h, d)) n++;
    else if (d !== t) break;
  }
  return n;
}
function bestStreak(h) {
  const t = today();
  let best = 0, cur = 0;
  for (let d = firstDay(h); d <= t; d++) {
    if (!isScheduled(h, d)) continue;
    if (isDone(h, d)) { cur++; best = Math.max(best, cur); }
    else if (d !== t) cur = 0;
  }
  return best;
}
function rate(h, from, to) {           // % выполнения запланированных дней в периоде
  const start = Math.max(from, firstDay(h)), end = Math.min(to, today());
  let plan = 0, done = 0;
  for (let d = start; d <= end; d++) {

    if (d === today() && !isDone(h, d)) continue;   // сегодня ещё не вечер
    plan++; if (isDone(h, d)) done++;
  }
  return plan ? Math.round(done / plan * 100) : 0;
}
function totalDays(h) {
  if (h.type === "check") return h.done.length;
  return Object.keys(h.log).filter(d => h.log[d] >= goal(h)).length;
}

/* ---------- Таймер ---------- */
function startTimer(h) {
  if (state.timer) stopTimer(true);
  state.timer = { id: h.id, start: Date.now(), day: today() };
  save(true); haptic("medium");
}
function stopTimer(silent) {
  const tm = state.timer; if (!tm) return;
  const h = state.habits.find(x => x.id === tm.id);
  state.timer = null;
  if (h) {
    const sec = (Date.now() - tm.start) / 1000;
    const wasDone = (h.log[tm.day] || 0) >= goal(h);
    h.log[tm.day] = Math.round((h.log[tm.day] || 0) + sec);
    if (!silent) {
      toast(`+${fmtDur(sec, true)} · ${h.name}`);
      if (!wasDone && !tm.notified && h.log[tm.day] >= goal(h)) afterComplete(h, tm.day);
    }
  }
  save(true); haptic("light");
}

/* ---------- Форматирование ---------- */
function plural(n, a, b, c) { const x = Math.abs(n) % 100, y = x % 10;
  return (x > 10 && x < 20) ? c : y === 1 ? a : (y >= 2 && y <= 4) ? b : c; }
function fmtDur(sec, short) {            // 5400 → «1 ч 30 мин»
  const m = Math.floor(sec / 60);
  if (m < 1) return short ? `${Math.max(0, Math.round(sec))} сек` : "0 мин";
  const h = Math.floor(m / 60), mm = m % 60;
  if (!h) return `${mm} мин`;
  return mm ? `${h} ч ${mm} мин` : `${h} ч`;
}
const fmtClock = sec => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
function goalText(h) {
  if (h.type === "time") return fmtDur(h.target * 60);
  if (h.type === "count") return `${fmtN(h.target)} ${h.unit}`;
  return "";
}
function progressText(h, day) {
  const v = value(h, day);
  if (h.type === "time") return `${fmtDur(v)} / ${fmtDur(h.target * 60)}`;
  if (h.type === "count") return `${fmtN(v)} / ${fmtN(h.target)} ${h.unit}`;
  return "";
}
function scheduleText(h) {
  if (h.days.length === 7) return "каждый день";
  if (h.days.length === 5 && [0,1,2,3,4].every(d => h.days.includes(d))) return "по будням";
  if (h.days.length === 2 && h.days.includes(5) && h.days.includes(6)) return "по выходным";
  return h.days.slice().sort().map(d => WD[d]).join(", ");
}
const fmtDayLong = d => { const x = fromDay(d); return `${x.getDate()} ${MONTHS_GEN[x.getMonth()]}`; };

/* =====================================================================
   ИНТЕРФЕЙС
   ===================================================================== */

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;

}

/* ---------------- Экран «Сегодня» ---------------- */
function renderToday() {

function listBlock() {

  return wrap;
}

function habitCard(h, off) {
  const d = selDay, fr = frac(h, d), s = streak(h);
  const running = !!(state.timer && state.timer.id === h.id && state.timer.day === d);
  const on = isDone(h, d) && !running;

function onAction(h) {

  }
  const running = state.timer && state.timer.id === h.id;
  if (h.type === "time" && d === today() && (running || !isDone(h, d))) {

  };
  const name = el("input", {class:"field", placeholder:"Например: читать перед сном", maxlength:"40", value:h.name});
  name.addEventListener("input", updPreview);

  // Тип
  const typeBox = el("div", {});
  const seg = el("div", {class:"seg"});

      h.type = k; [...seg.children].forEach(b => b.classList.remove("on")); e.currentTarget.classList.add("on");

  function stepper(val, onChange, suffix, stepFn) {
    const inp = el("input", {type:"number", inputmode:"numeric", class:"num", value:val});
    inp.addEventListener("input", () => { const n = parseInt(inp.value, 10); if (n > 0) onChange(n); });
    const bump = dir => { const cur = parseInt(inp.value, 10) || 0; const n = Math.max(1, cur + dir * stepFn(cur)); inp.value = n; onChange(n); haptic("select"); };
    return el("div", {class:"stepper"}, el("button", {onclick: () => bump(-1)}, "−"), inp, suffix ? el("small", {}, suffix) : null, el("button", {onclick: () => bump(1)}, "+"));

        haptic("select"); updPreview(); }}, u)));

    } else if (h.type === "time") {

      const chips = el("div", {class:"chips"});

        target.time = m; st.querySelector("input").value = m; mark(); haptic("select"); updPreview(); }}, fmtDur(m * 60))));
      mark();
      typeBox.append(el("div", {class:"label"}, "Сколько времени в день"), st, el("div", {style:"height:10px"}), chips,
        el("div", {class:"tip", style:"text-align:left"}, "На карточке будет таймер ▶ — запускаешь, и время считается само."));
    } else {
      typeBox.append(el("div", {class:"tip", style:"text-align:left;margin-top:10px"}, "Просто отмечаешь: сделал или нет."));
    }
  }

  // Дни недели
  const wdays = el("div", {class:"wdays"});
  const drawDays = () => [...wdays.children].forEach((b, i) => b.classList.toggle("on", h.days.includes(i)));
  WD.forEach((w, i) => wdays.append(el("button", {onclick: () => {
    h.days = h.days.includes(i) ? h.days.filter(x => x !== i) : h.days.concat(i).sort();
    drawDays(); haptic("select"); updPreview(); }}, w)));
  const daysQuick = el("div", {class:"chips", style:"margin-top:8px"},
    [["Каждый день",[0,1,2,3,4,5,6]],["Будни",[0,1,2,3,4]],["Выходные",[5,6]]].map(([l, arr]) =>
      el("button", {class:"chip", onclick: () => { h.days = arr.slice(); drawDays(); haptic("select"); updPreview(); }}, l)));

      h.emoji = em; emojis.querySelectorAll("button.on").forEach(b => b.classList.remove("on")); e.currentTarget.classList.add("on");

    h.color = c; [...colors.children].forEach(b => b.classList.remove("on")); e.currentTarget.classList.add("on");
    haptic("select"); updPreview(); }})));

  // Готовые
  let ready = null;
  if (!existing) {
    const chips = el("div", {class:"chips"});

}
function addHabit(tp) {

/* ---------------- Шторка ---------------- */
function openSheet(kids, onClose) {
  if (sheetClose) closeSheet(true);
  const bg = el("div", {class:"sheet-bg", onclick: () => closeSheet()});
  const sh = el("div", {class:"sheet"}, kids);
  if (!kids.some(k => k && k.classList && k.classList.contains("grab"))) sh.prepend(el("div", {class:"grab"}));
  document.body.append(bg, sh);
  sheetClose = instant => {
    sheetClose = null;
    const done = () => { bg.remove(); sh.remove(); };
    if (instant) done(); else { bg.classList.add("closing"); sh.classList.add("closing"); setTimeout(done, 210); }
    if (onClose) onClose();
  };
  if (tg && tg.BackButton && can("6.1")) tg.BackButton.show();
}
function closeSheet(instant) { if (sheetClose) sheetClose(instant); }

const stat = (v, l) => el("div", {class:"stat"}, el("b", {class:"num"}, v), el("small", {}, l));

/* ---------------- Статистика ---------------- */
function renderStats() {
  const t = today();
  const wrap = el("div", {class:"screen"});
  wrap.append(el("div", {class:"top"}, el("div", {}, el("div", {class:"hello"}, "Твой прогресс"), el("div", {class:"title"}, "Статистика"))));
  if (!state.habits.length) { wrap.append(el("div", {class:"empty"}, el("div", {}, "📊"), "Добавь привычки — и здесь появится твой прогресс.")); return app.append(wrap); }

  const dayRate = d => { const p = state.habits.filter(h => isScheduled(h, d) && firstDay(h) <= d);
    return p.length ? p.filter(h => isDone(h, d)).length / p.length : -1; };
  const avg = (from, to) => { let s = 0, n = 0; for (let d = from; d <= to; d++) { if (d === t && dayRate(d) <= 0) continue; const r = dayRate(d); if (r >= 0) { s += r; n++; } } return n ? Math.round(s / n * 100) : null; };
  const monday = t - wdOf(t);
  const weekPct = avg(monday, t), lastWeekPct = avg(monday - 7, monday - 1);
  const bestNow = state.habits.map(h => ({h, s: streak(h)})).sort((a, b) => b.s - a.s)[0];
  const record = Math.max(...state.habits.map(bestStreak));
  let perfect = 0; for (let d = t - 29; d <= t; d++) if (dayRate(d) === 1) perfect++;
  const diff = (weekPct !== null && lastWeekPct !== null) ? weekPct - lastWeekPct : 0;

  wrap.append(el("div", {class:"stats"},
    stat((weekPct || 0) + "%", diff ? `за неделю (${diff > 0 ? "+" : ""}${diff}% к прошлой)` : "выполнено за неделю"),
    stat(`🔥 ${bestNow.s}`, bestNow.s ? "лучшая серия сейчас" : "серия ещё впереди"),
    stat(String(perfect), plural(perfect, "идеальный день", "идеальных дня", "идеальных дней") + " за 30"),
    stat(String(record), "рекорд серии")));

  // Тепловая карта: 18 недель
  const weeks = 18, start = monday - (weeks - 1) * 7;
  const heat = el("div", {class:"heat"});
  for (let d = start; d < start + weeks * 7; d++) {
    const r = d > t ? -1 : dayRate(d);
    heat.append(el("i", {style: r > 0 ? `background:var(--accent);opacity:${.2 + r * .8}` : d > t ? "opacity:.35" : "",
      title: fmtDayLong(d)}));
  }
  wrap.append(el("div", {class:"card"}, el("h4", {}, "Последние 4 месяца", el("small", {}, "каждый квадрат — день")), heat,
    el("div", {class:"heat-legend"}, "меньше", [0, .3, .6, 1].map(o => el("i", {style: o ? `background:var(--accent);opacity:${.2 + o * .8}` : "background:var(--soft)"})), "больше")));

  // Рейтинг привычек
  const rank = el("div", {class:"card"}, el("h4", {}, "Привычки", el("small", {}, "за 30 дней")));
  state.habits.map(h => ({h, r: rate(h, t - 29, t)})).sort((a, b) => b.r - a.r).forEach(({h, r}) =>
    rank.append(el("div", {class:"rank", onclick: () => openDetail(h.id)},
      el("div", {class:"ico", style:`background:${tint(h.color, .16)}`}, h.emoji),
      el("div", {}, el("b", {}, h.name), el("small", {}, `🔥 ${streak(h)} · рекорд ${bestStreak(h)}`)),
      el("span", {class:"pct num", style:`color:${h.color}`}, r + "%"))));
  wrap.append(rank);

  // Пригласить
  wrap.append(el("button", {class:"invite", style:"width:100%;text-align:left", onclick: invite},
    el("div", {}, el("b", {}, "Позвать друга"), el("small", {}, "Вместе держать серию легче")), el("span", {}, "🔥")));
  app.append(wrap);
}
function invite() {

  const text = best >= 3 ? `Держу серию ${best} ${plural(best, "день", "дня", "дней")} подряд в ${APP_NAME} 🔥 Присоединяйся!`

/* ---------------- Онбординг ---------------- */
let onbStep = 0;
const picked = new Set([0, 2]);
function renderOnboarding() {
  const slides = [
    {e:"🔥", h:`Это ${APP_NAME}`, p:"Отмечай привычки каждый день и смотри, как растёт серия. Чем длиннее огонёк — тем жальче его прервать."},
    {e:"⏱️", h:"Шаги, время, отметки", p:"Считай стаканы воды и шаги, засекай чтение таймером или просто ставь галочку. Всё сохраняется в твоём Telegram."},
  ];
  const wrap = el("div", {class:"onb screen"});
  if (onbStep < slides.length) {
    const s = slides[onbStep];
    wrap.append(el("div", {class:"bigemoji"}, s.e), el("h1", {}, s.h), el("p", {}, s.p));
  } else {
    wrap.append(el("div", {class:"bigemoji"}, "🌱"), el("h1", {}, "С чего начнём?"),
      el("p", {}, "Выбери 1–3 привычки. Лучше начать с малого — потом добавишь ещё."));
    const chips = el("div", {class:"chips", style:"justify-content:center"});
    TEMPLATES.forEach((tp, i) => chips.append(el("button", {class:"chip" + (picked.has(i) ? " on" : ""),
      onclick: e => { picked.has(i) ? picked.delete(i) : picked.add(i); e.currentTarget.classList.toggle("on"); haptic("select"); }},
      `${tp.emoji} ${tp.name}`)));

  }

    haptic("light");
    if (onbStep < slides.length) { onbStep++; return render(); }
    [...picked].sort((a, b) => a - b).forEach(i => addHabit(TEMPLATES[i]));
    state.onboarded = true; save(true); screen = "main"; tab = "today"; haptic("success"); render();
  }}, onbStep < slides.length ? "Дальше" : "Начать"));
}

/* ---------------- Мелочи ---------------- */
function celebrate(text) {

  const set = ["🎉","🔥","✨","💪","⭐","🧡"];
  for (let i = 0; i < 34; i++) box.append(el("i", {style:`left:${Math.random() * 100}%;animation-delay:${Math.random() * .5}s;font-size:${18 + Math.random() * 14}px`}, set[i % set.length]));
  document.body.append(box); setTimeout(() => box.remove(), 2600);
  if (text) toast(text, 2600);
}
let toastEl = null;
function toast(text, ms) {
  if (toastEl) toastEl.remove();
  toastEl = el("div", {class:"toast"}, text);
  document.body.append(toastEl);
  const me = toastEl; setTimeout(() => { if (me === toastEl) { me.remove(); toastEl = null; } }, ms || 2000);
}

// Живой таймер: обновляем только цифры, без перерисовки экрана
setInterval(() => {
  if (!state.timer) return;
  const h = state.habits.find(x => x.id === state.timer.id); if (!h) return;
  const d = state.timer.day, v = value(h, d);
  document.querySelectorAll(`[data-live="${h.id}"]`).forEach(e => e.textContent = "▶ " + fmtClock(v));
  document.querySelectorAll(`[data-live-detail="${h.id}"]`).forEach(e => e.textContent = progressText(h, d));
  document.querySelectorAll(`[data-bar="${h.id}"]`).forEach(e => e.style.width = frac(h, d) * 100 + "%");
  const R = 19, C = 2 * Math.PI * R;
  document.querySelectorAll(`[data-ring="${h.id}"]`).forEach(e => e.setAttribute("stroke-dashoffset", C * (1 - frac(h, d))));
  const fill = document.querySelector(`.habit[data-id="${h.id}"] .fill`); if (fill) fill.style.width = frac(h, d) * 100 + "%";
  if (v >= goal(h) && !state.timer.notified) {               // цель достигнута — таймер можно оставить, но поздравим
    state.timer.notified = true; haptic("success"); toast(`Цель выполнена: ${h.name} ✅`);
    afterComplete(h, d);
  }
}, 1000);

// Наступил новый день, пока приложение открыто
let lastDay = today();
setInterval(() => {
  if (today() === lastDay) return;
  if (state.timer && state.timer.day !== today()) stopTimer(true);   // таймер вчерашнего дня закрываем
  lastDay = today(); selDay = lastDay; render();
}, 30000);

/* =====================================================================
   ЗАПУСК
   ===================================================================== */
(async function start() {
  render();
  let raw = "", ok = false;
  for (let attempt = 0; attempt < 3 && !ok; attempt++) {
    try { raw = await loadRaw(); ok = true; }
    catch(e) { await new Promise(r => setTimeout(r, 700)); }
  }
  if (!ok) {
    screen = "main";
    app.innerHTML = "";
    app.append(el("div", {class:"empty"}, el("div", {}, "📡"), "Не получилось загрузить данные.", el("br"),
      "Проверь интернет и открой приложение заново.", el("br"), el("br"),
      el("button", {class:"btn", style:"max-width:220px", onclick: () => location.reload()}, "Попробовать снова")));
    return;                         // loaded = false → ничего не сохраняем и не затираем облако
  }
  try { if (raw) { state = migrate(JSON.parse(raw)); if (useCloud) savedChunks = Math.ceil(raw.length / CHUNK); } }
  catch(e) { toast("Данные повреждены — начинаем заново"); }
  loaded = true;
  if (state.timer && state.timer.day !== today()) stopTimer(true);
  screen = state.onboarded ? "main" : "onboarding";
  render();
})();
</script>
</body>
</html>
